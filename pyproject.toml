[project]
name = "research-team"
version = "0.1.0"
description = "Multi-agent research team on LangChain v1 + LangGraph: planner, parallel researchers, writer, reviewer, human-in-the-loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-anthropic>=1.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
tavily = ["langchain-tavily>=0.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
research-team = "research_team.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
